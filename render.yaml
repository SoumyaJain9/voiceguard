services:
  - type: web
    name: voxguard-api
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODEL_PATH
        value: models/best_model.onnx
      - key: SQLITE_DB_PATH
        value: logs/audit_trail.db
